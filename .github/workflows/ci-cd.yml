name: CI/CD VitalSync

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4   # ✅ version à jour

      - name: Setup Node.js
        uses: actions/setup-node@v4   # ✅ version à jour
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: ./backend
        run: npm install

      - name: Run ESLint
        working-directory: ./backend
        run: |
          npm install eslint --save-dev
          npx eslint . || true

      - name: Run Jest tests
        working-directory: ./backend
        run: npm test

  build-docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}   # ✅ correction ici

      - name: Build & push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner | toLower }}/vitalsync-backend:${{ github.sha }}

      - name: Build & push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner | toLower }}/vitalsync-frontend:${{ github.sha }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start staging environment
        run: |
          docker compose up -d --build   # ✅ version moderne (remplace docker-compose)

      - name: Wait for backend to be ready
        run: |
          echo "Waiting 10s for backend to start..."
          sleep 10

      - name: Health check backend
        run: |
          STATUS_CODE=$(curl --write-out "%{http_code}" --silent --output /dev/null http://localhost:3000/health)
          if [ $STATUS_CODE -ne 200 ]; then
            echo "Health check failed with status $STATUS_CODE"
            exit 1
          else
            echo "Backend is healthy!"
          fi

      - name: Show running containers
        run: docker ps