name: CI/CD VitalSync

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: ./backend
        run: npm install

      - name: Run ESLint
        working-directory: ./backend
        run: |
          npm install eslint --save-dev
          npx eslint . || true

      - name: Run Jest tests
        working-directory: ./backend
        run: npm test

  build-docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build backend Docker image
      - name: Build backend Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/vitalsync-backend:${{ github.sha }} ./backend

      # Build frontend Docker image
      - name: Build frontend Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/vitalsync-frontend:${{ github.sha }} ./frontend

      # Push backend image
      - name: Push backend image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/vitalsync-backend:${{ github.sha }}

      # Push frontend image
      - name: Push frontend image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/vitalsync-frontend:${{ github.sha }}